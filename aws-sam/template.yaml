AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lanchonetes próximas (execução local com SAM)

Resources:
  LanchonetesProximas:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../pulumi/lanchonetes/
      Handler: handler.lambda_handler
      Runtime: python3.13
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: lanchonetes
          # Declaradas aqui para que o env.json possa sobrescrevê-las.
          DYNAMODB_ENDPOINT: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: ""
      Events:
        Api:
          Type: Api
          Properties:
            Path: /lanchonetes-proximas
            Method: post
